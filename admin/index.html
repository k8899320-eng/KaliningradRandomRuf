<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0f14">
<title>Админка · Руф-КЛД</title>
<style>
  :root{--bg:#0d0f14;--panel:#161a22;--line:#262c38;--text:#eef1f6;--muted:#8b93a5;--accent:#ff6a3d;--accent2:#ffb03d;--ok:#4ade80;--bad:#ff6a6a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  header h1{font-size:20px;margin:0}
  header h1 span{color:var(--accent)}
  header .me{margin-left:auto;color:var(--muted);font-size:14px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid #2c3342;background:#1f2430;color:var(--text);padding:8px 12px}
  button.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0d06;border:0;font-weight:700}
  button.ok{border-color:#2c6b44;color:var(--ok)}
  button.bad{border-color:#6b2c2c;color:var(--bad)}
  button:disabled{opacity:.5}
  input,select,textarea{font:inherit;background:#0f1218;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  textarea{width:100%;min-height:120px;resize:vertical}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button.on{background:#2a2f3d;border-color:var(--accent2);color:var(--accent2)}
  .tabs .n{background:var(--accent);color:#1a0d06;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .ph img{width:100%;max-height:320px;object-fit:cover;border-radius:10px;display:block;cursor:zoom-in}
  .meta{color:var(--muted);font-size:13px;margin:6px 0}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
  .ip{font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .tag{display:inline-block;font-size:12px;border-radius:99px;padding:2px 8px;border:1px solid var(--line)}
  .tag.ban{color:var(--bad);border-color:#6b2c2c}.tag.adm{color:var(--accent2);border-color:#6b5a2c}
  .empty{color:var(--muted);padding:20px;text-align:center}
  .tablewrap{overflow-x:auto}
  .login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:10px;text-align:center}
  .msg{min-height:20px;color:var(--bad);font-size:14px}
  .muted{color:var(--muted)}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:420px;width:100%;display:grid;gap:10px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:10px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
  .kpi b{display:block;font-size:22px;color:var(--accent2)} .kpi span{font-size:12px;color:var(--muted)}
  .bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:140px;align-items:end}
  .bar{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
  .bar i{display:block;width:100%;border-radius:5px 5px 2px 2px;min-height:2px}
  .bar span{font-size:11px;color:var(--text);position:absolute;bottom:calc(100% - 14px)}
  .bar em{font-style:normal;font-size:10px;color:var(--muted);margin-top:3px}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
  #lb img{max-width:96%;max-height:96%}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="lb" onclick="this.style.display='none'"><img id="lbimg" alt=""></div>
<script>
"use strict";
const SUPA="https://hmkecihzribgeguzcwkt.supabase.co", KEY="sb_publishable_9HipXlYi7d-mQbgXMVmr-w_v_n38Dkz";
const photoUrl=p=>`${SUPA}/storage/v1/object/public/roof-photos/${p}`;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=s=>s?new Date(s).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
let TOKEN=null, NICK="", DATA=null, TAB="stats", ADDR={}, REPN=0, UQ="";
fetch("../buildings.json").then(r=>r.json()).then(j=>{ (j.buildings||[]).forEach(b=>ADDR[b.id]=(b.city&&b.city!=="Калининград"?b.city+", ":"")+(b.street?b.street+(b.num?", "+b.num:""):(b.name||b.id))); }).catch(()=>{});
const addr=id=>ADDR[id]||id;
try{ TOKEN=localStorage.getItem("roof_admin_token"); NICK=localStorage.getItem("roof_admin_nick")||""; }catch(e){}
async function rpc(name,args){
  const r=await fetch(`${SUPA}/rest/v1/rpc/${name}`,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  if(!r.ok){ let t=""; try{ const j=await r.json(); t=j.message||""; }catch(e){} throw new Error(t||("ошибка "+r.status)); }
  const x=await r.text(); return x?JSON.parse(x):null;
}
const REASONS=["Спам","Оскорбления","Неприемлемые фото","Фото не с крыши","Флуд","Мультиаккаунт","Выдаёт себя за другого"];
const DURS=[[1,"1 час"],[24,"1 день"],[72,"3 дня"],[168,"7 дней"],[720,"30 дней"],[0,"Навсегда"]];

function loginView(msg){
  $("app").innerHTML=`<div class="login"><h2 style="margin:0">🔐 Админка Руф-КЛД</h2>
    <div class="muted" style="font-size:14px">Вход аккаунтом с сайта</div>
    <input id="ln" placeholder="Ник" autocomplete="username" value="${esc(NICK)}"><input id="lp" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="pri" id="lgo">Войти</button><div class="msg" id="lmsg">${esc(msg||"")}</div></div>`;
  const go=async()=>{ $("lmsg").textContent="…"; try{ const r=await rpc("login_user",{p_nick:$("ln").value,p_pass:$("lp").value}); if(r.error) throw new Error(r.error);
      TOKEN=r.token; NICK=r.nick; localStorage.setItem("roof_admin_token",TOKEN); localStorage.setItem("roof_admin_nick",NICK); load(); }catch(e){ $("lmsg").textContent=e.message; } };
  $("lgo").onclick=go; $("lp").onkeydown=e=>{ if(e.key==="Enter") go(); };
}
function claimView(){
  $("app").innerHTML=`<div class="login"><h2 style="margin:0">🔑 Стать админом</h2>
    <div class="muted" style="font-size:14px">Ты вошёл как <b>${esc(NICK)}</b>, но у аккаунта нет прав админа. Введи одноразовый код админа.</div>
    <input id="cc" placeholder="Код вида KLD-XXXX-XXXX"><button class="pri" id="cgo">Активировать</button>
    <button id="clo">Войти другим аккаунтом</button><div class="msg" id="cmsg"></div></div>`;
  $("cgo").onclick=async()=>{ try{ await rpc("admin_claim",{p_token:TOKEN,p_code:$("cc").value.trim()}); load(); }catch(e){ $("cmsg").textContent=e.message; } };
  $("clo").onclick=logout;
}
function logout(){ try{ rpc("logout_user",{p_token:TOKEN}); }catch(e){} TOKEN=null; localStorage.removeItem("roof_admin_token"); loginView(); }

let ROLE="admin";
async function load(){
  if(!TOKEN) return loginView();
  try{ const me=await rpc("staff_me",{p_token:TOKEN}); ROLE=me.role; }catch(e){ ROLE="admin"; }
  if(ROLE==="mod"){ try{ DATA=await rpc("mod_overview",{p_token:TOKEN}); DATA.bans=[]; DATA.guests=[]; try{ REPN=(await rpc("admin_reports",{p_token:TOKEN})).filter(r=>r.photo).length; }catch(e){ REPN=0; } if(!["pending","comments","reports","ankets","users"].includes(TAB)) TAB="pending"; render(); }
    catch(e){ $("app").innerHTML=`<div class="center"><p>${esc(e.message)}</p></div>`; } return; }
  try{ DATA=await rpc("admin_overview",{p_token:TOKEN}); try{ REPN=(await rpc("admin_reports",{p_token:TOKEN})).filter(r=>r.photo).length; }catch(e){ REPN=0; } render(); }
  catch(e){ if(/Нет доступа/.test(e.message)){ const v=await rpc("register_visit",{p_token:TOKEN}).catch(()=>null); if(v&&v.user) return claimView(); return loginView("Сессия истекла, войди снова"); } $("app").innerHTML=`<div class="empty">Ошибка: ${esc(e.message)} <button onclick="load()">Повторить</button></div>`; }
}
function render(){
  const d=DATA, banned=d.users.filter(u=>u.banned_until).length;
  if(ROLE==="mod") return renderMod();
  const tabs=[["stats","📊 Статистика",0],["pending","📷 Модерация",d.pending.length],["comments","💬 Комменты",0],["reports","🚩 Жалобы",REPN],["houses","🏢 Дома",0],["ankets","🤝 Анкеты",0],["users","👤 Пользователи",d.users.length],["guests","🌐 Все IP",d.guests.length],["bans","⛔ Баны",d.bans.length],["post","📣 Пост",d.post?1:0],["log","📜 Журнал",0]];
  $("app").innerHTML=`<header><h1>Админка <span>Руф·КЛД</span></h1><button onclick="load()">↻ Обновить</button><div class="me">👑 ${esc(NICK)} · <a href="#" id="lo" style="color:var(--muted)">выйти</a> · <a href="../" style="color:var(--muted)">на сайт</a></div></header>
    <div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${TAB===t[0]?"on":""}">${t[1]}${t[2]?`<span class="n">${t[2]}</span>`:""}</button>`).join("")}</div><div id="tab"></div>`;
  $("lo").onclick=e=>{ e.preventDefault(); logout(); };
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ TAB=b.dataset.t; render(); });
  ({stats:tabStats,pending:tabPending,comments:tabComments,reports:tabReports,houses:tabHouses,ankets:tabAnkets,users:tabUsers,guests:tabGuests,bans:tabBans,post:tabPost,log:tabLog})[TAB]();
}
function extra(c){ return c.photos&&c.photos.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0">${c.photos.map(x=>`<img src="${photoUrl(x)}" data-full="${photoUrl(x)}" loading="lazy" style="width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:zoom-in">`).join("")}</div>`:""; }
function tabPending(){
  const L=DATA.pending;
  $("tab").innerHTML=L.length?`<div class="grid">${L.map(c=>`<div class="card"><div class="ph"><img src="${photoUrl(c.photo)}" data-full="${photoUrl(c.photo)}" loading="lazy"></div>${extra(c)}
    <div class="meta"><b style="color:var(--accent2)">${esc(c.author)}</b> · ${dt(c.created_at)} · ${esc(addr(c.house_id))}${c.photos&&c.photos.length?` · <b>📷 ${c.photos.length+1} фото</b> (одобряются все сразу)`:""}</div>
    ${c.body&&c.body!=="📷"?`<div style="margin-bottom:8px">${esc(c.body)}</div>`:""}
    <div class="row"><button class="ok" data-ap="${c.id}">✅ Одобрить</button><button class="bad" data-rj="${c.id}">❌ Отклонить</button><button data-del="${c.id}">🗑 Удалить комментарий</button></div></div>`).join("")}</div>`
    :`<div class="empty">🎉 Нет фото на модерации</div>`;
  $("tab").onclick=async e=>{
    const im=e.target.closest("img[data-full]"); if(im){ $("lbimg").src=im.dataset.full; $("lb").style.display="flex"; return; }
    const ap=e.target.closest("[data-ap]"), rj=e.target.closest("[data-rj]"), dl=e.target.closest("[data-del]");
    try{
      if(ap){ ap.disabled=true; await rpc("admin_moderate",{p_token:TOKEN,p_comment:+ap.dataset.ap,p_approve:true}); }
      else if(rj){ rj.disabled=true; await rpc("admin_moderate",{p_token:TOKEN,p_comment:+rj.dataset.rj,p_approve:false}); }
      else if(dl){ if(!confirm("Удалить комментарий целиком?")) return; dl.disabled=true; await rpc("admin_delete_comment",{p_token:TOKEN,p_comment:+dl.dataset.del}); }
      else return;
      load();
    }catch(err){ alertMsg(err.message); }
  };
}
async function tabStats(){
  $("tab").innerHTML='<div class="empty">Загружаю…</div>';
  let S; try{ S=await rpc("admin_stats",{p_token:TOKEN}); }catch(e){ $("tab").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }
  const T=S.totals, days=S.days||[];
  const kpi=[["👥","Посетителей",T.visitors],["👤","Аккаунтов",T.users],["📷","Фото",T.photos],["⏳","На модерации",T.pending],["💬","Комментариев",T.comments],["❤️","Лайков",T.likes],["✅","Отметок «был»",T.been],["🤝","Анкет",T.ankets],["⛔","Активных банов",T.bans]];
  const chart=(key,title,color)=>{ const mx=Math.max(1,...days.map(d=>d[key]));
    return `<div class="card"><div class="muted" style="margin-bottom:8px">${title} за 14 дней</div><div class="bars">${days.map(d=>`<div class="bar" title="${new Date(d.day).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}: ${d[key]}"><i style="height:${Math.round(d[key]/mx*100)}%;background:${color}"></i><span>${d[key]||""}</span><em>${new Date(d.day).getDate()}</em></div>`).join("")}</div></div>`; };
  const tg=S.tg||{};
  $("tab").innerHTML=`<div class="kpis">${kpi.map(k=>`<div class="kpi"><div>${k[0]}</div><b>${k[2]}</b><span>${k[1]}</span></div>`).join("")}</div>
    ${chart("visitors","Новые посетители","#7dd3fc")}${chart("regs","Регистрации","#ffb03d")}${chart("comments","Комментарии","#7dff7a")}
    <div class="card"><div class="muted" style="margin-bottom:8px">🔥 Самые популярные дома (комментарии + отметки)</div>${(S.top_houses||[]).length?S.top_houses.map((h,i)=>`<div class="row" style="justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${i+1}. ${esc(addr(h.house_id))}</span><b>${h.n}</b></div>`).join(""):'<div class="muted">Пока пусто</div>'}</div>
    <div class="card"><b>📲 Уведомления в Telegram о новых фото на модерации</b>
      <div class="muted" style="margin:6px 0 10px;font-size:14px">${tg.chat?"✅ Подключено — новые фото будут приходить тебе в Telegram.":tg.bot?"⏳ Токен сохранён, осталось подтвердить чат (шаг 3–4).":"Не подключено."}</div>
      ${tg.chat?`<button class="bad" id="tgOff">Отключить</button>`:`<ol style="margin:0 0 10px 18px;padding:0;line-height:1.6;font-size:14px">
        <li>В Telegram открой <b>@BotFather</b> → /newbot → придумай имя и username бота.</li>
        <li>BotFather пришлёт <b>токен</b> вида <span class="ip">123456789:AA…</span> — вставь его сюда и нажми «Сохранить».</li>
        <li>Открой своего нового бота и нажми <b>«Старт»</b>.</li>
        <li>Нажми «Проверить» — бот пришлёт тестовое сообщение.</li></ol>
      <div class="row"><input id="tgTok" placeholder="Токен бота" style="flex:1;min-width:220px"><button id="tgSave">Сохранить</button><button class="pri" id="tgCheck">Проверить</button></div>`}
      <div class="msg" id="tgMsg" style="color:var(--accent2)"></div></div>`;
  if($("tgSave")) $("tgSave").onclick=async()=>{ try{ await rpc("admin_tg_connect",{p_token:TOKEN,p_bot:$("tgTok").value}); $("tgMsg").textContent="Токен сохранён. Теперь открой бота в Telegram, нажми «Старт» и потом «Проверить»."; }catch(e){ $("tgMsg").textContent=e.message; } };
  if($("tgCheck")) $("tgCheck").onclick=async()=>{ $("tgMsg").textContent="Проверяю…"; try{ const r=await rpc("admin_tg_check",{p_token:TOKEN}); $("tgMsg").textContent=r.msg; if(r.ok) setTimeout(tabStats,1500); }catch(e){ $("tgMsg").textContent=e.message; } };
  if($("tgOff")) $("tgOff").onclick=async()=>{ if(!confirm("Отключить уведомления в Telegram?")) return; await rpc("admin_tg_disconnect",{p_token:TOKEN}); tabStats(); };
}
async function tabAnkets(){
  $("tab").innerHTML='<div class="empty">Загружаю…</div>';
  let L=[]; try{ L=await rpc("admin_list_ankets",{p_token:TOKEN}); }catch(e){ $("tab").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }
  $("tab").innerHTML=L.length?L.map(a=>`<div class="card"><div class="row" style="justify-content:space-between"><div><b style="color:var(--accent2)">${esc(a.nick)}</b> <span class="ip muted">${esc(a.last_ip||"")}</span> · ${dt(a.created_at)}</div>
      <div class="row"><button class="bad" data-bu="${a.user_id}" data-bn="${esc(a.nick)}">⛔ Бан</button><button data-dk="${a.id}">🗑 Удалить анкету</button></div></div>
      <div style="margin:6px 0"><b>@${esc(a.tg)}</b></div><div style="white-space:pre-wrap">${esc(a.experience)}</div>
      ${a.replies.map(r=>`<div class="row" style="margin-top:6px;font-size:14px"><span><b>${esc(r.nick)}</b>: ${esc(r.body)} <span class="muted">· ${dt(r.created_at)}</span></span><button data-dr="${r.id}" style="padding:2px 8px;font-size:12px">🗑</button></div>`).join("")}
    </div>`).join(""):'<div class="empty">Анкет нет</div>';
  $("tab").onclick=async e=>{
    const dk=e.target.closest("[data-dk]"), dr=e.target.closest("[data-dr]"), bu=e.target.closest("[data-bu]");
    try{
      if(dk){ if(!confirm("Удалить анкету?")) return; await rpc("admin_delete_anket",{p_token:TOKEN,p_anket:+dk.dataset.dk,p_reply:null}); tabAnkets(); }
      if(dr){ await rpc("admin_delete_anket",{p_token:TOKEN,p_anket:null,p_reply:+dr.dataset.dr}); tabAnkets(); }
      if(bu) banDialog(bu.dataset.bn,{p_user:+bu.dataset.bu,p_ip:null});
    }catch(err){ alertMsg(err.message); }
  };
}
function tabUsers(){
  const q=UQ.toLowerCase(), L=DATA.users.filter(u=>!q||u.nick.toLowerCase().includes(q)||(u.last_ip||"").includes(q)||(u.reg_ip||"").includes(q));
  $("tab").innerHTML=`<div class="row" style="margin-bottom:10px"><input id="uq" placeholder="🔎 Ник или IP" value="${esc(UQ)}" style="flex:1"><span class="muted">${L.length} из ${DATA.users.length}</span></div>`+(L.length?`<div class="tablewrap"><table><tr><th>Ник</th><th>Последний IP</th><th>IP регистрации</th><th>Был</th><th>Комм.</th><th>Статус</th><th></th></tr>
    ${L.map(u=>`<tr><td><b>${esc(u.nick)}</b>${u.is_admin?' <span class="tag adm">админ</span>':u.role==="mod"?' <span class="tag" style="background:#1f47c9;color:#fff">модер</span>':""}<div class="muted" style="font-size:12px">с ${dt(u.created_at)}</div></td>
      <td class="ip">${esc(u.last_ip||"—")}</td><td class="ip">${esc(u.reg_ip||"—")}</td><td>${dt(u.last_seen)}</td><td>${u.comments}</td>
      <td>${u.banned_until?`<span class="tag ban">бан ${u.banned_until==="infinity"||new Date(u.banned_until).getFullYear()>3000?"навсегда":"до "+dt(u.banned_until)}</span><div class="muted" style="font-size:12px">${esc(u.ban_reason||"")}</div>`:"✅"}</td>
      <td><div class="row">${u.is_admin?"":u.banned_until?`<button class="ok" data-unban="${u.id}">Разбанить</button>`:`<button class="bad" data-ban="${u.id}">⛔ Бан</button>`}
        <a href="../#u-${encodeURIComponent(u.nick)}" target="_blank" title="Профиль на сайте"><button>👁</button></a>
        <button data-pw="${u.id}" title="Сбросить пароль">🔑</button>${u.is_admin?"":`<button data-role="${u.id}" data-r="${u.role==="mod"?"":"mod"}" title="${u.role==="mod"?"Снять модерку":"Сделать модератором"}">🛡${u.role==="mod"?"✕":""}</button>`}${u.is_admin?"":`<button data-purge="${u.id}" title="Удалить все его комментарии">🧹</button>`}</div></td></tr>`).join("")}</table></div>`
    :`<div class="empty">Никого не нашлось</div>`);
  $("uq").oninput=e=>{ UQ=e.target.value; const pos=e.target.selectionStart; tabUsers(); $("uq").focus(); $("uq").setSelectionRange(pos,pos); };
  $("tab").onclick=async e=>{

    <input id="brc" maxlength="300" placeholder="Напиши причину" style="display:none">
    <div class="muted" style="font-size:13px">Человек увидит «Вы заблокированы создателем» и эту причину.</div>
    <div class="row"><button class="bad" id="bgo">Забанить</button><button id="bno">Отмена</button></div><div class="msg" id="bmsg"></div>`;
  $("modal").style.display="flex";
  $("br").onchange=()=>{ $("brc").style.display=$("br").value==="__"?"":"none"; };
  $("bno").onclick=()=>{ $("modal").style.display="none"; };
  $("bgo").onclick=async()=>{
    const reason=$("br").value==="__"?$("brc").value.trim():$("br").value; if(!reason){ $("bmsg").textContent="Укажи причину"; return; }
    try{ await rpc("admin_ban",Object.assign({p_token:TOKEN,p_hours:+$("bd").value,p_reason:reason},args)); $("modal").style.display="none"; load(); }catch(e){ $("bmsg").textContent=e.message; }
  };
}
function alertMsg(t){ $("mbox").innerHTML=`<div style="white-space:pre-wrap">${esc(t)}</div><button onclick="document.getElementById('modal').style.display='none'">OK</button>`; $("modal").style.display="flex"; }
load();
</script>
</body>
</html>
