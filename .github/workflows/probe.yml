name: probe-tall
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          BBOX="54.640,20.340,54.790,20.640"
          q=f'''[out:json][timeout:90];
          (way["building"]["building:levels"~"^(1[5-9]|[2-9][0-9])$"]({BBOX});
           way["building:part"]["building:levels"~"^(1[5-9]|[2-9][0-9])$"]({BBOX});
           relation["building"]["building:levels"~"^(1[5-9]|[2-9][0-9])$"]({BBOX});
           way["building"]["height"~"^([5-9][0-9]|1[0-9][0-9])"]({BBOX});
           way["building"="construction"]["building:levels"]({BBOX});
           way["construction"~"apartments|residential"]({BBOX}););
          out center tags;'''
          import time
          d=None
          for r in range(6):
            for m in ["https://overpass-api.de/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.kumi.systems/api/interpreter"]:
              try:
                  d=json.load(urllib.request.urlopen(urllib.request.Request(m,data=urllib.parse.urlencode({"data":q}).encode(),headers={"User-Agent":"ruf-probe"}),timeout=150)); break
              except Exception as e: print("fail",m,e)
            if d: break
            time.sleep(30)
          for e in d["elements"]:
              t=e.get("tags",{}); c=e.get("center",{})
              print("ROW",json.dumps({"id":e["type"]+"/"+str(e["id"]),"lat":c.get("lat"),"lon":c.get("lon"),**{k:v for k,v in t.items() if k.startswith(("building","addr","name","height","construction","start","levels"))}},ensure_ascii=False))
          PY
