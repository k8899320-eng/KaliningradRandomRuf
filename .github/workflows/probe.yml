name: probe-addr
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          q='''[out:json][timeout:60];
          (nwr["addr:street"="Эпроновская улица"]["addr:housenumber"~"^1"](54.68,20.48,54.72,20.54);
           nwr["addr:street"="улица 1812 года"]["addr:housenumber"="126"](54.68,20.48,54.74,20.58););
          out center tags;'''
          d=None
          for r in range(6):
            for m in ["https://overpass-api.de/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.kumi.systems/api/interpreter"]:
              try:
                d=json.load(urllib.request.urlopen(urllib.request.Request(m,data=urllib.parse.urlencode({"data":q}).encode(),headers={"User-Agent":"ruf-probe"}),timeout=90)); break
              except Exception as e: print("fail",m,e)
            if d: break
            time.sleep(20)
          for e in d["elements"]:
            c=e.get("center") or {"lat":e.get("lat"),"lon":e.get("lon")}
            print("ROW",json.dumps({"id":e["type"]+"/"+str(e["id"]),**c,**e.get("tags",{})},ensure_ascii=False))
          PY
