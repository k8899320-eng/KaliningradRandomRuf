name: fetch-hero
on: workflow_dispatch
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install --quiet pillow
          mkdir -p assets
          python3 - <<'PY'
          import urllib.request, urllib.parse, io
          from PIL import Image
          UA={"User-Agent":"ruf-kld-site/1.0 (github pages; contact k8899320-eng)"}
          F={"hero1":"Old cathedral of Kaliningrad in Russia.jpg","hero2":"Kaliningrad 05-2017 img10 aerial view.jpg","hero3":"Kaliningrad Panorama (5664122123).jpg"}
          for k,f in F.items():
              u="https://commons.wikimedia.org/wiki/Special:FilePath/"+urllib.parse.quote(f.replace(" ","_"))+"?width=2560"
              im=Image.open(io.BytesIO(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=120).read())).convert("RGB")
              for w,suf in ((2400,""),(1100,"-m")):
                  x=im.copy(); x.thumbnail((w,w*2)); x.save(f"assets/{k}{suf}.jpg",quality=78,optimize=True,progressive=True)
              print(k, im.size)
          PY
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add assets && git commit -qm "Фоновые фото (Wikimedia Commons, свободные лицензии)" && git push origin HEAD:main
