name: fetch-photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out && cd out
          for f in c-3/mwaqawkk-f8sxo2.jpg c-3/mwaqc0og-aizw9i.jpg c-3/mwaq9vxt-hbe1pi.jpg; do
            curl -sSf -o "$(basename $f)" "https://hmkecihzribgeguzcwkt.supabase.co/storage/v1/object/public/roof-photos/$f"; done
          ls -la
          cd .. && git init -q tmp && cd tmp && git config user.name bot && git config user.email bot@users.noreply.github.com
          cp ../out/* . && git add . && git commit -qm photos && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-photos
