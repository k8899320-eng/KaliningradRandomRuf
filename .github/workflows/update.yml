name: Обновить дома и опубликовать сайт

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # каждый понедельник
  workflow_dispatch:        # кнопка «Run workflow» вручную

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Взять текущий список домов с сайта
        run: |
          curl -fsSL --max-time 30 "https://k8899320-eng.github.io/KaliningradRandomRuf/buildings.json" -o buildings.json \
            && python3 -c "import json;d=json.load(open('buildings.json'));assert d['buildings'];print('текущих домов:',len(d['buildings']))" \
            || { echo "текущего списка нет"; rm -f buildings.json; }

      - name: Обновить дома из OpenStreetMap (раз в неделю, вручную или если списка нет)
        if: github.event_name != 'push' || hashFiles('buildings.json') == ''
        timeout-minutes: 8
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.parse, urllib.request
          BBOX = "54.640,20.340,54.790,20.640"
          RE = "^(9|[1-9][0-9])$"
          q = f'''[out:json][timeout:90];
          (way["building"]["building:levels"~"{RE}"]["addr:housenumber"]({BBOX});
           relation["building"]["building:levels"~"{RE}"]["addr:housenumber"]({BBOX}););
          out center tags;'''
          mirrors = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
          ]
          data = None
          for url in mirrors:
              try:
                  body = urllib.parse.urlencode({"data": q}).encode()
                  req = urllib.request.Request(url, data=body, headers={"User-Agent": "roof-randomizer-kaliningrad"})
                  with urllib.request.urlopen(req, timeout=100) as r:
                      data = json.load(r)
                  print("OK:", url); break
              except Exception as e:
                  print("FAIL:", url, e)
          if not data:
              raise SystemExit("OpenStreetMap не ответил — оставляю старый список")
          out = []
          for e in data["elements"]:
              t = e.get("tags", {})
              try: lv = int(t.get("building:levels", "").split(".")[0])
              except ValueError: continue
              street = t.get("addr:street") or t.get("addr:place")
              c = e.get("center")
              if lv < 9 or not street or not c: continue
              out.append({
                  "id": f'{e["type"]}/{e["id"]}', "lv": lv, "street": street,
                  "num": t.get("addr:housenumber", ""),
                  "name": t.get("name") or t.get("building:name") or "",
                  "type": t.get("building", ""),
                  "lat": round(c["lat"], 6), "lon": round(c["lon"], 6),
                  "year": t.get("building:start_date") or t.get("start_date") or "",
                  "h": t.get("height", ""),
              })
          if not out:
              raise SystemExit("пустой список — оставляю старый")
          json.dump({"updated": time.strftime("%Y-%m-%d"), "buildings": out},
                    open("buildings.json", "w"), ensure_ascii=False, separators=(",", ":"))
          print("домов:", len(out))
          EOF

      - name: Определить районы домов
        if: hashFiles('buildings.json') != ''
        timeout-minutes: 6
        continue-on-error: true
        run: |
          pip install --quiet shapely
          python3 - <<'EOF'
          import json, urllib.parse, urllib.request
          from shapely.geometry import LineString, Point
          from shapely.ops import polygonize, unary_union
          d = json.load(open("buildings.json"))
          B = d["buildings"]
          if all(b.get("d") for b in B):
              print("районы уже есть"); raise SystemExit(0)
          q = """[out:json][timeout:90];
          rel["boundary"="administrative"]["name"~"^(Ленинградский|Московский|Центральный) район$"](54.60,20.30,54.82,20.70);
          out geom;"""
          data = None
          for url in ["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.kumi.systems/api/interpreter"]:
              try:
                  req = urllib.request.Request(url, data=urllib.parse.urlencode({"data": q}).encode(), headers={"User-Agent": "roof-randomizer-kaliningrad"})
                  with urllib.request.urlopen(req, timeout=100) as r: data = json.load(r)
                  print("OK", url); break
              except Exception as e: print("FAIL", url, e)
          if not data: raise SystemExit("нет границ районов")
          polys = []
          for rel in data["elements"]:
              name = rel.get("tags", {}).get("name", "")
              lines = [LineString([(p["lon"], p["lat"]) for p in m["geometry"]]) for m in rel.get("members", []) if m.get("type") == "way" and m.get("role") in ("outer", "") and m.get("geometry")]
              poly = unary_union(list(polygonize(unary_union(lines))))
              print("найдено:", name, rel.get("tags",{}).get("admin_level"), "линий:", len(lines), "пусто" if poly.is_empty else "ок")
              if not poly.is_empty: polys.append((name.replace(" район", "").strip(), poly))
          n = 0
          for b in B:
              pt = Point(b["lon"], b["lat"])
              for name, poly in polys:
                  if poly.contains(pt): b["d"] = name; n += 1; break
          json.dump(d, open("buildings.json", "w"), ensure_ascii=False, separators=(",", ":"))
          print("районы назначены:", n, "из", len(B))
          EOF

      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d admin ]; then cp -r admin _site/admin; fi
          if [ -d game ]; then cp -r game _site/game && (cd game && zip -qr ../_site/roofer-game.zip .); fi
          if [ -f buildings.json ]; then cp buildings.json _site/; else echo "::warning::нет buildings.json — сайт будет грузить дома напрямую"; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
